custom_display_brightness:
  styles:
    custom_fields:
      opt1:
        - justify-self: end
        - align-self: end
        - padding-right: 1em
        - font-size: 0.7em
        - color: green
  custom_fields:
    opt1: |
      [[[
        if (entity.state == 'unavailable' || variables.input_brightness == null || variables.input_brightness == 0 ) return;
        else 
          return `
            <ha-icon icon="mdi:brightness-5" style="width: 1em;"></ha-icon>
            <span style=>${variables.input_brightness}Lx</span>`;
      ]]]

custom_display_position:
  styles:
    custom_fields:
      opt1:
        - justify-self: end
        - align-self: end
        - padding-right: 1em
        - font-size: 0.7em
        - color: green
  custom_fields:
    opt1: |
      [[[
        if (entity.state == 'unavailable' || variables.input_posision == null || variables.input_posision == 0 ) return;
        else
          if (entity.state == 'open' && entity.attributes.icon == 'mdi:window-shutter')
            return `
              <ha-icon icon=mdi:window-shutter-open style="width: 1em;"></ha-icon>
              <span style=>${variables.input_posision}%</span>`
          else if (entity.state == 'closed' && entity.attributes.icon == 'mdi:curtains-closed')
            return `
              <ha-icon icon=mdi:curtains-closed style="width: 1em;"></ha-icon>
              <span style=>${variables.input_posision}%</span>`
          else if (entity.state == 'closed' && entity.attributes.icon == 'mdi:blinds')
            return `
              <ha-icon icon=mdi:blinds-open style="width: 1em;"></ha-icon>
              <span style=>${variables.input_posision}%</span>`
          else
            return `
              <ha-icon icon=${entity.attributes.icon} style="width: 1em;"></ha-icon>
              <span style=>${variables.input_posision}%</span>`
      ]]]

custom_display_power:
  styles:
    custom_fields:
      opt1:
        - justify-self: end
        - align-self: end
        - padding-right: 1em
        - font-size: 0.7em
        - color: green
  custom_fields:
    opt1: |
      [[[
        if (entity.state == 'unavailable' || variables.input_power == null || variables.input_power < 1) return;
        else return `
          <ha-icon icon="hass:flash" style="width: 1em;"></ha-icon>
          <span style=>${variables.input_power}W</span>`
      ]]]

custom_display_media:
  styles:
    custom_fields:
      opt1:
        - justify-self: end
        - align-self: end
        - padding-right: 1em
        - font-size: 0.7em
        - color: green
      opt2:
        - justify-self: end
        - align-self: start
        - padding-right: 1em
        - font-size: 0.7em
        - color: green
  custom_fields:
    opt1: |
      [[[
        if (entity.state == 'off' || entity.state == 'unavailable')
          return;
        else if (entity.attributes.media_content_type == undefined && entity.attributes.app_name != undefined) 
          return `<marquee scrollamount="2" width=60px>
            <span style=>${entity.attributes.app_name}</span><marquee>`
        else if (entity.attributes.media_content_type == 'video')
          return `<marquee scrollamount="2" width=60px>
            <span style=>${entity.attributes.app_name}</span></marquee>`
        else if (entity.attributes.media_content_type == 'music')
          if (entity.attributes.media_artist != undefined)
            return `<marquee scrollamount="2" width=60px>
              <span style=>${entity.attributes.media_artist}</span></marquee>`;
          else if (entity.attributes.app_name != undefined && entity.attributes.media_artist == undefined)
            return `<marquee scrollamount="2" width=60px>
              <span style=>${entity.attributes.app_name}</span></marquee>`;
          else 
            return `<marquee scrollamount="2" width=60px>
              <span style=>Music</span></marquee>`;
        else
          return `<marquee scrollamount="2" width=60px>
            <span style=>Debug Line</span></marquee>`
      ]]]
    opt2: |
      [[[
        if (entity.state == 'off' || entity.state == 'unavailable')
          return;
        else if (entity.attributes.media_content_type == 'video')
          if (entity.attributes.media_title != undefined)
            return `<marquee scrollamount="2" width=60px>
              <span style=>${entity.attributes.media_title}</span></marquee>`;
          else 
            return `<marquee scrollamount="2" width=60px>
              <span style=>Video</span></marquee>`;
        else if(entity.attributes.media_content_type == 'music')
          if (entity.attributes.media_title != undefined)
            return `<marquee scrollamount="2" width=60px>
              <span style=>${entity.attributes.media_title}</span></marquee>`;
          else 
            return `<marquee scrollamount="2" width=60px>
              <span style=>Music</span></marquee>`;
        else
          return `<marquee scrollamount="2" width=60px>
            <span style=>Debug Line</span></marquee>`
      ]]]

