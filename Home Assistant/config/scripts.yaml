enter_cinema_mode:
  alias: 영화관 모드 켜기
  sequence:
  - action: switch.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: switch.0x286847fffe27072d_left
    enabled: false
  - type: turn_on
    device_id: 4c9fbf16d3fe3ce6e3736b2891511232
    entity_id: 641656d522f8fa09d08b6f425cb5f74b
    domain: switch
  - action: media_player.play_media
    target:
      entity_id: media_player.hk_citation_100_256bf3
    data:
      media_content_id: media-source://tts/google_translate?message=%EC%98%81%ED%99%94%EA%B4%80+%EB%AA%A8%EB%93%9C%EA%B0%80+%EC%8B%A4%ED%96%89%EC%A4%91%EC%9E%85%EB%8B%88%EB%8B%A4.%0A%EC%9E%A0%EC%8B%9C%EB%A7%8C+%EA%B8%B0%EB%8B%A4%EB%A0%A4%EC%A3%BC%EC%84%B8%EC%9A%94.&language=ko
      media_content_type: provider
    metadata:
      title: '영화관 모드가 실행중입니다.

        잠시만 기다려주세요.'
      thumbnail: https://brands.home-assistant.io/_/google_translate/logo.png
      media_class: app
      children_media_class:
      navigateIds:
      - {}
      - media_content_type: app
        media_content_id: media-source://tts
      - media_content_type: provider
        media_content_id: media-source://tts/google_translate?message=%EC%98%81%ED%99%94%EA%B4%80+%EB%AA%A8%EB%93%9C%EA%B0%80+%EC%8B%A4%ED%96%89%EC%A4%91%EC%9E%85%EB%8B%88%EB%8B%A4.%0A%EC%9E%A0%EC%8B%9C%EB%A7%8C+%EA%B8%B0%EB%8B%A4%EB%A0%A4%EC%A3%BC%EC%84%B8%EC%9A%94.&language=ko
    enabled: false
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - if:
    - condition: state
      entity_id: cover.livingroom_screen
      state: closed
    then:
    - action: cover.open_cover
      metadata: {}
      data: {}
      target:
        entity_id: cover.livingroom_screen
  - if:
    - condition: state
      entity_id: switch.projector
      state: 'off'
    then:
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.projector
  mode: restart
  icon: mdi:theater
  description: ''
exit_cinema_mode:
  alias: 영화관 모드 끄기
  sequence:
  - action: media_player.play_media
    target:
      entity_id: media_player.hk_citation_100_256bf3
    data:
      media_content_id: media-source://tts/google_translate?message=%EC%98%81%ED%99%94%EA%B4%80+%EB%AA%A8%EB%93%9C%EA%B0%80+%EC%A2%85%EB%A3%8C+%EB%90%A9%EB%8B%88%EB%8B%A4.+%EC%9E%A0%EC%8B%9C%EB%A7%8C+%EA%B8%B0%EB%8B%A4%EB%A0%A4+%EC%A3%BC%EC%84%B8%EC%9A%94.&language=ko
      media_content_type: provider
    metadata:
      title: 영화관 모드가 종료 됩니다. 잠시만 기다려 주세요.
      thumbnail: https://brands.home-assistant.io/_/google_translate/logo.png
      media_class: app
      children_media_class:
      navigateIds:
      - {}
      - media_content_type: app
        media_content_id: media-source://tts
      - media_content_type: provider
        media_content_id: media-source://tts/google_translate?message=%EC%98%81%ED%99%94%EA%B4%80+%EB%AA%A8%EB%93%9C%EA%B0%80+%EC%A2%85%EB%A3%8C+%EB%90%A9%EB%8B%88%EB%8B%A4.+%EC%9E%A0%EC%8B%9C%EB%A7%8C+%EA%B8%B0%EB%8B%A4%EB%A0%A4+%EC%A3%BC%EC%84%B8%EC%9A%94.&language=ko
    enabled: false
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - if:
    - condition: state
      entity_id: switch.projector
      state: 'on'
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.projector
  - if:
    - condition: state
      entity_id: cover.livingroom_screen
      state: open
    then:
    - action: cover.close_cover
      metadata: {}
      data: {}
      target:
        entity_id: cover.livingroom_screen
    enabled: true
  - action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: switch.0x286847fffe27072d_left
    enabled: false
  mode: single
  icon: mdi:theater
  description: ''
