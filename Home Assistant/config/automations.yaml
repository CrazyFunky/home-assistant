- id: '1780446435876'
  alias: 서재방 컴퓨터 자동화
  description: 서재 무선 스위치로 PC와 주변 장비 제어
  triggers:
  - id: wireless_switch
    trigger: mqtt
    options:
      topic: zigbee2mqtt/서재 무선 스위치/action
  - entity_id:
    - sensor.0x60a423fffe620ee1_power
    below: 5
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: pc_power_off
    trigger: numeric_state
  - event_type: computer_turn_on
    id: computer_event_on
    trigger: event
  - event_type: computer_turn_off
    id: computer_event_off
    trigger: event
  conditions: []
  actions:
  - choose:
    - alias: '이벤트: Computer turn on - PC 켜기 (switch.computer)'
      conditions:
      - condition: trigger
        id: computer_event_on
      sequence:
      - action: switch.turn_on
        alias: 'Step 1: PC 본체 전원 켜기'
        target:
          entity_id: switch.0x60a423fffe620ee1
        data: {}
      - action: switch.turn_on
        alias: 'Step 2: 오디오 전원 켜기 (L2)'
        target:
          entity_id: switch.0xa4c138be3ee9d6f5_l2
      - action: switch.turn_on
        alias: 'Step 3: 모니터 전원 켜기 (L1)'
        target:
          entity_id: switch.0xa4c138be3ee9d6f5_l1
      - alias: 'Step 4: ESPHome Toggle 스위치 인식 대기'
        repeat:
          sequence:
          - delay:
              seconds: 1
          until:
          - condition: template
            value_template: '{{ states(''switch.home_pc_power_switch_toggle'') !=
              ''unavailable'' }}'
      - action: switch.turn_on
        alias: 'Step 5: PC 파워 버튼 누르기'
        target:
          entity_id: switch.home_pc_power_switch_toggle
    - alias: '이벤트: Computer turn off - PC 끄기 (switch.computer)'
      conditions:
      - condition: trigger
        id: computer_event_off
      sequence:
      - action: switch.turn_on
        alias: 'Step 1: Hard Power Off 누르기 (Windows 종료 신호)'
        target:
          entity_id: switch.home_pc_power_switch_hard_power_off
    - alias: Single - PC 켜기 (서재 무선스위치)
      conditions:
      - condition: trigger
        id: wireless_switch
      - condition: template
        value_template: '{{ trigger.payload == ''single'' }}'
      sequence:
      - action: switch.turn_on
        alias: 'Step 1: PC 본체 전원 켜기'
        target:
          entity_id: switch.0x60a423fffe620ee1
        data: {}
      - action: switch.turn_on
        alias: 'Step 2: 오디오 전원 켜기 (L2)'
        target:
          entity_id: switch.0xa4c138be3ee9d6f5_l2
        data: {}
      - action: switch.turn_on
        alias: 'Step 3: 모니터 전원 켜기 (L1)'
        target:
          entity_id: switch.0xa4c138be3ee9d6f5_l1
        data: {}
      - alias: 'Step 4: ESPHome Toggle 스위치 인식 대기'
        repeat:
          sequence:
          - delay:
              seconds: 1
          until:
          - condition: template
            value_template: '{{ states(''switch.home_pc_power_switch_toggle'') !=
              ''unavailable'' }}'
      - action: switch.turn_on
        alias: 'Step 5: PC 파워 버튼 누르기'
        target:
          entity_id: switch.home_pc_power_switch_toggle
    - alias: Long - PC Windows 종료 (서재 무선스위치)
      conditions:
      - condition: trigger
        id: wireless_switch
      - condition: template
        value_template: '{{ trigger.payload == ''long'' }}'
      sequence:
      - action: switch.turn_on
        alias: 'Step 1: Hard Power Off 누르기'
        target:
          entity_id: switch.home_pc_power_switch_hard_power_off
    - alias: Double - Home Cloud 토글 (서재 무선스위치)
      conditions:
      - condition: trigger
        id: wireless_switch
      - condition: template
        value_template: '{{ trigger.payload == ''double'' }}'
      sequence:
      - action: switch.toggle
        target:
          entity_id: switch.home_cloud
    - alias: PC 전력 < 5W - 자동 전원 차단
      conditions:
      - condition: trigger
        id: pc_power_off
      sequence:
      - alias: 모든 전원 차단 (본체, L1, L2, L3)
        action: switch.turn_off
        target:
          entity_id:
          - switch.0xa4c138be3ee9d6f5_l1
          - switch.0xa4c138be3ee9d6f5_l2
          - switch.0xa4c138be3ee9d6f5_l3
          - switch.0x60a423fffe620ee1
        data: {}
  mode: restart
- id: '1781060212780'
  alias: 주방 통합 자동화
  description: '주방 조명(모션/쿡탑), 식탁등 연동, 환풍기 제어를 통합 관리

    - 모션 감지 시 주방등 켜기 (07~22시)

    - 쿡탑 ON 시 주방등 켜기 (시간 제한 없음)

    - 쿡탑 ON 중에는 주방등 꺼짐 방지

    - 모션 없음 + 쿡탑 OFF → 30초 후 주방등 끄기

    - 주방등 켜질 때 → 300ms 후 식탁등 켜기

    - 쿡탑 OFF → 5분 후 환풍기 OFF → 5초 → 환풍기 ON(ready)'
  triggers:
  - platform: state
    entity_id: binary_sensor.0x00124b002267369a_occupancy
    to: 'on'
    id: motion_on
  - platform: state
    entity_id: binary_sensor.0x00124b002267369a_occupancy
    to: 'off'
    for:
      seconds: 30
    id: motion_off
  - platform: state
    entity_id: binary_sensor.cooktop_activate
    from: 'off'
    to: 'on'
    id: cooktop_on
  - platform: state
    entity_id: binary_sensor.cooktop_activate
    from: 'on'
    to: 'off'
    for:
      seconds: 30
    id: cooktop_off_light
  - platform: state
    entity_id: binary_sensor.cooktop_activate
    from: 'on'
    to: 'off'
    for:
      minutes: 5
    id: cooktop_off_fan
  - platform: state
    entity_id: switch.0x28dba7fffea60da9_center
    to: 'on'
    id: kitchen_light_on
  actions:
  - choose:
    - alias: 모션 감지 → 주방등 켜기 (07~22시)
      conditions:
      - condition: trigger
        id: motion_on
      - condition: time
        after: 07:00:00
        before: '22:00:00'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.0x28dba7fffea60da9_left
    - alias: 쿡탑 ON → 주방등 켜기 (시간 무관)
      conditions:
      - condition: trigger
        id: cooktop_on
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.0x28dba7fffea60da9_left
    - alias: 주방등 ON → 식탁등 켜기 (300ms 후)
      conditions:
      - condition: trigger
        id: kitchen_light_on
      sequence:
      - delay:
          milliseconds: 300
      - action: light.turn_on
        target:
          device_id:
          - 31ca1248ee7128084cf005864abf1bee
          - 8be9b256412620842e700611fa3ad0f9
          - fde293010137ca7f9081a009c9ef8921
        data:
          brightness: 255
          color_temp_kelvin: 6535
    - alias: 모션 없음 → 주방등 끄기 (쿡탑 OFF + 모션 없음 확인)
      conditions:
      - condition: trigger
        id: motion_off
      - condition: state
        entity_id: binary_sensor.cooktop_activate
        state: 'off'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.0x28dba7fffea60da9_left
    - alias: 쿡탑 OFF 30초 → 주방등 끄기 (모션 없음 확인)
      conditions:
      - condition: trigger
        id: cooktop_off_light
      - condition: state
        entity_id: binary_sensor.0x00124b002267369a_occupancy
        state: 'off'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.0x28dba7fffea60da9_left
    - alias: 쿡탑 OFF 5분 → 환풍기 OFF → 5초 → 환풍기 ON (ready)
      conditions:
      - condition: trigger
        id: cooktop_off_fan
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.0x60a423fffe620f3a
      - delay:
          seconds: 5
      - action: switch.turn_on
        target:
          entity_id: switch.0x60a423fffe620f3a
  mode: restart
