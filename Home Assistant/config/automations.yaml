- id: '1618209424133'
  alias: 알림 - Daily 브리핑
  description: ''
  triggers:
  - hours: '7'
    minutes: '18'
    seconds: '0'
    platform: time_pattern
  conditions: []
  actions:
  - action: telegram_bot.send_message
    data:
      entity_id:
      - notify.crazyfunky_home_assistant_854393463
      title: "----------------------------------\n\U0001F4C5 {{ now().strftime('%Y년
        %m월 %d일') }} Daily 브리핑\n----------------------------------"
      message: "\U0001F324️ 실시간 날씨 정보\n- 현재 기온: {{ state_attr('weather.yeongtongdong','temperature')
        }}°C\n- 최고 기온: {{ states('sensor.coegoondo') }}°C\n- 강수 확률: {{ states('sensor.gangsuhwagryul')
        }}%\n{%- if states('sensor.gangsuhwagryul') | float > 50 %}\n*우산을 챙기세요!* ☂️\n{%-
        endif %}\n⚡ 월간 에너지 현황\n- 총 전기 사용량: {{ states('sensor.monthly_energy_meter_total')
        }} kWh\n\U0001F50C 현재 소비전력 (Smart Meter)\n- 전등라인: {{ states('sensor.power_smart_meter_1')
        }} W\n- 주방라인: {{ states('sensor.power_smart_meter_2') }} W\n- 거실라인: {{ states('sensor.power_smart_meter_3')
        }} W\n- 에어콘라인: {{ states('sensor.power_smart_meter_4') }} W\n\U0001F4B0 암호화폐
        시세\n- 비트코인(BTC): ${{ \"{:,.0f}\".format(states('sensor.cryptoinfo_bitcoin_price')
        | float) }}\n⚠️ 시스템 상태 점검\n{%- set ns = namespace(problems=[], count=0) %}\n{%-
        set filters = ['backup','home_pc_network','effect','power_on_behavior','stroke_limit','ble_','google_','broadlink','unknown_','decoded_power','music_assistant','notify.','device_tracker.','homecloud','siggiseceoggi','geonjogi']
        %}\n{%- for state in states %}\n{%- if state.state in ['unavailable', 'unknown']
        %}\n{%- set skip = false %}\n{%- for f in filters %}\n{%- if f in state.entity_id
        %}{%- set skip = true %}{%- endif %}\n{%- endfor %}\n{%- if not skip %}\n{%-
        set ns.count = ns.count + 1 %}\n{%- if ns.count <= 7 %}\n{%- set ns.problems
        = ns.problems + [state.entity_id] %}\n{%- endif %}\n{%- endif %}\n{%- endif
        %}\n{%- endfor %}\n{%- if ns.count > 0 %}\n\U0001F534 주의 필요: {{ ns.count }}개
        장치 비정상\n{%- for device in ns.problems %}\n- {{ device }}\n{%- endfor %}\n{%-
        if ns.count > 7 %}\n외 {{ ns.count - 7 }}개 더 있음\n{%- endif %}\n{%- else %}\n✅
        모든 주요 장치 정상\n{%- endif %}\n-----------------------------------"
  mode: single
