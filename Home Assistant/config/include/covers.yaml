  - platform: cover_rf_time_based
    devices:
      livingroom_curtain:
        name: "거실 커튼"
        travelling_time_up: 9
        travelling_time_down: 9
        close_script_entity_id: script.close_living_room_curtain
        stop_script_entity_id: script.stop_living_room_curtain
        open_script_entity_id: script.open_living_room_curtain
      livingroom_screen:
        name: "거실 스크린"
        travelling_time_up: 20
        travelling_time_down: 20
        close_script_entity_id: script.up_living_room_screen
        stop_script_entity_id: script.stop_living_room_screen
        open_script_entity_id: script.down_living_room_screen
