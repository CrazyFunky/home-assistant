  #                   IT 기기 상태                #
  #                                               #
  #################################################
  - title: IT기기
    path: work
    icon: mdi:laptop
    visible:
      - user: c5281a1dfa3a4b3098ff090e2438067d
      - user: 1611e15b19a84cedada82d46ea11b07f
      - user: 18d1d97dc86b44ebbb94b3646808d012
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: button
            entity: switch.computer
            name: Home-PC
            show_state: false
            show_icon: true
            show_name: true
            icon_height: 100px
            tap_action:
              action: more-info
          - type: conditional
            conditions:
              - entity: switch.computer
                state: 'on'
            card:
              type: picture-glance
              entities: []
              camera_image: camera.home_pc_screen_0
              tap_action:
                action: more-info
          - type: conditional
            conditions:
              - entity: switch.computer
                state: 'on'
            card:
              type: horizontal-stack
              cards:
                - type: entities
                  entities:
                    - entity: sensor.home_pc_system_boot_time
                      name: 부팅 시간
                    - entity: sensor.home_pc_system_uptime
                      name: 기동 시간
                    - entity: sensor.home_pc_network_0_ipv4
                      name: IP (유선)
          - type: conditional
            conditions:
              - entity: switch.computer
                state: 'on'
              - entity: sensor.home_pc_cpu_usage
                state_not: unknown
            card:
              type: horizontal-stack
              cards:
                - type: gauge
                  entity: sensor.home_pc_cpu_usage
                  min: 0
                  max: 100
                  name: CPU 사용률
                - type: gauge
                  entity: sensor.home_pc_memory_usage
                  min: 0
                  max: 100
                  name: Memory 사용률
          - type: conditional
            conditions:
              - entity: switch.computer
                state: 'on'
              - entity: sensor.home_pc_storage_c_usage
                state_not: unknown
              - entity: sensor.home_pc_storage_d_usage
                state_not: unknown
            card:
              type: horizontal-stack
              cards:
                - type: gauge
                  entity: sensor.home_pc_storage_c_usage
                  min: 0
                  max: 100
                  name: C-Drive (465MB)
                  severity:
                    green: 25
                    yellow: 50
                    red: 75
                - type: gauge
                  entity: sensor.home_pc_storage_d_usage
                  min: 0
                  max: 100
                  name: D-Drive (931GB)
                  severity:
                    green: 25
                    yellow: 50
                    red: 75

      - type: vertical-stack
        cards:
          - type: button
            entity: switch.home_cloud
            name: Home-Cloud (DS920+)
            show_state: false
            show_icon: true
            show_name: true
            icon_height: 100px
            tap_action:
              action: more-info
          - type: conditional
            conditions:
              - entity: switch.home_cloud
                state: 'on'
            card:
              type: horizontal-stack
              cards:
                - type: entities
                  entities:
                    - entity: binary_sensor.homecloud_drive_2_exceeded_max_bad_sectors
                      name: Disk 1 (WD20EFRX-68EUZN0)
                      icon: mdi:harddisk
                      secondary_info: last-changed
                    - entity: binary_sensor.homecloud_drive_3_exceeded_max_bad_sectors
                      name: Disk 2 (WD20EFRX-68EUZN0)
                      icon: mdi:harddisk
                      secondary_info: last-changed
                    - entity: binary_sensor.homecloud_drive_4_exceeded_max_bad_sectors
                      name: Disk 3 (DT01ACA200)
                      icon: mdi:harddisk
                      secondary_info: last-changed
                    - entity: binary_sensor.homecloud_drive_5_exceeded_max_bad_sectors
                      name: Disk 4 (MQ01ABD100)
                      secondary_info: last-changed
                      icon: mdi:harddisk
          - type: conditional
            conditions:
              - entity: switch.home_cloud
                state: 'on'
            card:
              type: horizontal-stack
              cards:
                - type: gauge
                  entity: sensor.homecloud_cpu_utilization_total
                  min: 0
                  max: 100
                  name: CPU 사용률
                - type: gauge
                  entity: sensor.homecloud_memory_usage_real
                  min: 0
                  max: 100
                  name: Memory 사용률
          - type: conditional
            conditions:
              - entity: switch.home_cloud
                state: 'on'
            card:
              type: horizontal-stack
              cards:
                - type: gauge
                  name: Volume 1 사용률
                  entity: sensor.homecloud_volume_1_volume_used
                  min: 0
                  max: 100
                  severity:
                    green: 25
                    yellow: 50
                    red: 75
                - type: gauge
                  name: Volume 2 사용률
                  entity: sensor.homecloud_volume_2_volume_used
                  min: 0
                  max: 100
                  severity:
                    green: 25
                    yellow: 50
                    red: 75
          - type: conditional
            conditions:
              - entity: switch.home_cloud
                state: 'on'
            card:
              type: horizontal-stack
              cards:
                - type: gauge
                  entity: sensor.homecloud_volume_1_average_disk_temp
                  min: 0
                  name: Volume 1 온도
                  max: 80
                - type: gauge
                  entity: sensor.homecloud_volume_2_average_disk_temp
                  min: 0
                  name: Volume 2 온도
                  max: 80
