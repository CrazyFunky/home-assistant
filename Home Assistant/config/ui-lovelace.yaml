button_card_templates: !include dashboards/button_card_templates.yaml

background: var(--background-image)
views:
  - title: SweetHome
    path: switch
    icon: mdi:home-assistant
    # theme: ios-dark-mode
    badges: []
    cards:
      #################################################
      #                                               #
      #                     날씨                       #
      #                                               #
      #################################################
      - type: vertical-stack
        cards:
          - type: custom:weather-card
            entity: weather.yeongtongdong
            number_of_forecasts: "5"
            name: 영통3동
            forecast: false
            details: true
            current: true
            hourly_forecast: true
          #################################################
          #                                               #
          #                     소비전력                    #
          #                                               #
          #################################################
          - type: custom:apexcharts-card
            graph_span: 1month
            span:
              end: month
            experimental:
              color_threshold: true
            header:
              show: true
              title: 이번달 전력 사용량
              show_states: true
              colorize_states: true
            now:
              show: false
              label: Now
            cache: false
            series:
              - entity: sensor.daily_energy_meter_total
                type: column
                show:
                  header_color_threshold: true
                  extremas: true
                  in_header: raw
                  in_chart: true
                statistics:
                  type: change
                  period: day
                  align: middle
                color_threshold:
                  - value: 0
                    color: green
                  - value: 12
                    color: yellow
                  - value: 13
                    color: orange
                  - value: 14
                    color: red
              - entity: sensor.monthly_energy_meter_total
                type: column
                show:
                  header_color_threshold: true
                  extremas: false
                  in_header: raw
                  in_chart: false
                color_threshold:
                  - value: 0
                    color: green
                  - value: 360
                    color: yellow
                  - value: 380
                    color: orange
                  - value: 400
                    color: red
              - entity: sensor.monthly_kwh_to_won_forecast_kwh
                type: column
                show:
                  header_color_threshold: true
                  extremas: false
                  in_header: raw
                  in_chart: false
                color_threshold:
                  - value: 0
                    color: green
                  - value: 320
                    color: yellow
                  - value: 360
                    color: orange
                  - value: 400
                    color: red
            apex_config:
              yaxis:
                min: 0
              xaxis:
                labels:
                  datetimeFormatter:
                    month: M/dd
                    day: M/dd
          - type: entities
            entities:
              - entity: sensor.monthly_kwh_to_won_won
              - entity: sensor.monthly_kwh_to_won_forecast_won
          - type: entities
            entities:
              - type: custom:multiple-entity-row
                entity: sensor.binance_btcusdt_24h_change
                name: BTCUSDT
                state_header: 09:00
                entities:
                  - entity: sensor.binance_btcusdt_price
                    name: 가격
              - type: custom:multiple-entity-row
                entity: sensor.binance_ethusdt_24h_change
                name: ETHUSDT
                state_header: 09:00
                entities:
                  - entity: sensor.binance_ethusdt_price
                    name: 가격
              - type: custom:multiple-entity-row
                entity: sensor.binance_ondousdt_24h_change
                name: ONDOUSDT
                state_header: 09:00
                entities:
                  - entity: sensor.binance_ondousdt_price
                    name: 가격
              - type: custom:multiple-entity-row
                entity: sensor.binance_trumpusdt_24h_change
                name: TRUMPUSDT
                state_header: 09:00
                entities:
                  - entity: sensor.binance_trumpusdt_price
                    name: 가격
      #################################################
      #                                               #
      #                     Room 상태                 #
      #                                               #
      #################################################
      - type: vertical-stack
        cards:
          - type: custom:button-card
            entity: sensor.power_smart_meter_1
            name: 안방
            icon: mdi:bed
            show_icon: true
            show_name: false
            show_state: true
