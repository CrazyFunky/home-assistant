              card:
                - height: 80px
                - background: rgba(0, 0, 0, 0.3)
                - border: 1px solid rgba(0, 0, 0, 0.3)
                - border-radius: 10px
              grid:
                - grid-template-areas: |
                    "i i o1i o2i o3i o4i"
                    "i i o1s o2s o3s o4s"
                    "i i o5i o6i o7i o8i"
                    "s s o5s o6s o7s o8s"
                - grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr
                - grid-template-rows: repeat(4, 25%)
              icon:
                - align-self: start
                - justify-self: center
                - color: |
                    [[[
                      if (entity.state < 50) return 'cyan';
                      else if (entity.state >= 50 && entity.state < 200) return 'green';
                      else if (entity.state >= 200 && entity.state < 500) return 'yellow';
                      else if (entity.state >= 500 && entity.state < 1000) return 'orange';
                      else return 'red';
                    ]]]
              state:
                - align-self: start
                - justify-self: center
                - font-size: 0.8em
                - font-weight: bold
                - color: |
                    [[[
                      if (entity.state < 50) return 'cyan';
                      else if (entity.state >= 50 && entity.state < 200) return 'green';
                      else if (entity.state >= 200 && entity.state < 500) return 'yellow';
                      else if (entity.state >= 500 && entity.state < 1000) return 'orange';
                      else return 'red';
