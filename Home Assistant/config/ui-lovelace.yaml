                  - align-self: center
                  - justify-self: center
                  - margin-top: '-1em'
                  - width: 20px
                  - '--text-color-sensor': |
                      [[[
                        if (states["sensor.0x00124b001f875767_temperature"].state < -5) return 'blue';
                        else if (states["sensor.0x00124b001f875767_temperature"].state >= -5 && states["sensor.0x00124b001f875767_temperature"].state < 18) return 'cyan';
                        else if (states["sensor.0x00124b001f875767_temperature"].state >= 18 && states["sensor.0x00124b001f875767_temperature"].state < 26) return 'green';
                        else if (states["sensor.0x00124b001f875767_temperature"].state >= 26 && states["sensor.0x00124b001f875767_temperature"].state < 30) return 'orange';
                        else return 'red';
                      ]]]
                o2i:
