                      [[[
                        if (states["sensor.home_livingroom_iaq_10_0_m_value"].state < 31) return 'cyan';
                        else if (states["sensor.home_livingroom_iaq_10_0_m_value"].state >= 31 && states["sensor.home_livingroom_iaq_10_0_m_value"].state < 81) return 'green';
                        else if (states["sensor.home_livingroom_iaq_10_0_m_value"].state >= 81 && states["sensor.home_livingroom_iaq_10_0_m_value"].state < 151) return 'orange';
                        else return 'red';
                      ]]]
                o6i:
