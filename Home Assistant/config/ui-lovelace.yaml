              custom_fields:
                o1i:
                  - align-self: center
                  - justify-self: center
                  - margin-top: '-0.7em'
                o2i:
                  - align-self: center
                  - justify-self: center
                  - margin-top: '-0.7em'
                o3i:
                  - align-self: center
                  - justify-self: center
                  - margin-top: '-0.7em'
                o4i:
                  - align-self: center
                  - justify-self: center
                  - margin-top: '-0.7em'
                o5i:
                  - align-self: start
                  - justify-self: center
                  - width: 1em
