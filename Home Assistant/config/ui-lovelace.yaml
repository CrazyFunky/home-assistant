                  - justify-self: center
                  - margin-top: '-1em'
                  - width: 20px
                  - '--text-color-sensor': |
                      [[[
                        if (states["sensor.0x00124b001f875767_humidity"].state < 10) return 'blue';
                        else if (states["sensor.0x00124b001f875767_humidity"].state >= 10 && states["sensor.0x00124b001f875767_humidity"].state < 40) return 'cyan';
                        else if (states["sensor.0x00124b001f875767_humidity"].state >= 40 && states["sensor.0x00124b001f875767_humidity"].state < 60) return 'green';
                        else if (states["sensor.0x00124b001f875767_humidity"].state >= 60 && states["sensor.0x00124b001f875767_humidity"].state < 80) return 'orange';
                        else return 'red';
                      ]]]
