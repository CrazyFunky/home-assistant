                  - justify-self: center
                  - width: 1em
                  - '--text-color-sensor': |
                      [[[
                        if (states["sensor.home_livingroom_iaq_2_5_m_value"].state < 16) return 'cyan';
                        else if (states["sensor.home_livingroom_iaq_2_5_m_value"].state >= 16 && states["sensor.home_livingroom_iaq_2_5_m_value"].state < 36) return 'green';
                        else if (states["sensor.home_livingroom_iaq_2_5_m_value"].state >= 36 && states["sensor.home_livingroom_iaq_2_5_m_value"].state < 76) return 'orange';
                        else return 'red';
                      ]]]
                o7i:
                  - align-self: start
                  - justify-self: center
                  - width: 1em
                  - '--text-color-sensor': |
                      [[[
                        if (states["sensor.home_livingroom_iaq_co2_value"].state < 400) return 'blue';
                        else if (states["sensor.home_livingroom_iaq_co2_value"].state >= 400 && states["sensor.home_livingroom_iaq_co2_value"].state < 700) return 'cyan';
                        else if (states["sensor.home_livingroom_iaq_co2_value"].state >= 700 && states["sensor.home_livingroom_iaq_co2_value"].state < 1000) return 'green';
                        else if (states["sensor.home_livingroom_iaq_co2_value"].state >= 1000 && states["sensor.home_livingroom_iaq_co2_value"].state < 1500) return 'yellow';
                        else if (states["sensor.home_livingroom_iaq_co2_value"].state >= 1500 && states["sensor.home_livingroom_iaq_co2_value"].state < 2000) return 'orange';
                        else return 'red';
