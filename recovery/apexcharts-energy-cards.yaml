# Recovery snapshot from /config/ui-lovelace.yaml, 2026-11-25.
# List of four energy cards; replace matching cards, not the whole dashboard.
- type: custom:apexcharts-card
  graph_span: 1month
  span:
    end: month
  experimental:
    color_threshold: true
  header:
    show: true
    title: 이번달 전력 사용량
    show_states: true
    colorize_states: true
  now:
    show: false
    label: Now
  cache: false
  series:
    - entity: sensor.daily_energy_meter_total
      type: column
      show:
        header_color_threshold: true
        extremas: true
        in_header: raw
        in_chart: true
      statistics:
        type: change
        period: day
        align: middle
      color_threshold:
        - value: 0
          color: green
        - value: 12
          color: yellow
        - value: 13
          color: orange
        - value: 14
          color: red
    - entity: sensor.monthly_energy_meter_total
      type: column
      show:
        header_color_threshold: true
        extremas: false
        in_header: raw
        in_chart: false
      color_threshold:
        - value: 0
          color: green
        - value: 360
          color: yellow
        - value: 380
          color: orange
        - value: 400
          color: red
    - entity: sensor.monthly_kwh_to_won_forecast_kwh
      type: column
      show:
        header_color_threshold: true
        extremas: false
        in_header: raw
        in_chart: false
      color_threshold:
        - value: 0
          color: green
        - value: 320
          color: yellow
        - value: 360
          color: orange
        - value: 400
          color: red
  apex_config:
    yaxis:
      min: 0
    xaxis:
      labels:
        datetimeFormatter:
          month: M/dd
          day: M/dd

- type: custom:apexcharts-card
  graph_span: 24h
  span:
    start: day
  experimental:
    color_threshold: true
  header:
    show: true
    title: 시간별 소비전력
    show_states: true
    colorize_states: true
  now:
    show: false
    label: Now
  cache: true
  series:
    - entity: sensor.hourly_energy_meter_total
      name: 오늘(시간별)
      type: column
      opacity: 0.75
      show:
        header_color_threshold: true
        in_header: raw
        extremas: true
        in_chart: true
      statistics:
        type: change
        period: hour
        align: middle
      color_threshold:
        - value: 0.4
          color: green
        - value: 0.6
          color: yellow
        - value: 0.8
          color: orange
        - value: 1
          color: red
    - entity: sensor.hourly_energy_meter_total
      type: line
      name: 어제(시간별)
      offset: '-1d'
      stroke_width: 2
      show:
        header_color_threshold: true
        extremas: false
        in_header: false
        in_chart: true
        offset_in_name: false
      statistics:
        type: change
        period: hour
        align: middle
      color_threshold:
        - value: 0.4
          color: green
        - value: 0.6
          color: yellow
        - value: 0.8
          color: orange
        - value: 1
          color: red
    - entity: sensor.daily_energy_meter_total
      type: column
      show:
        header_color_threshold: true
        extremas: false
        in_header: raw
        in_chart: false
      color_threshold:
        - value: 0
          color: green
        - value: 12
          color: yellow
        - value: 13
          color: orange
        - value: 14
          color: red
  apex_config:
    yaxis:
      min: 0
    xaxis:
      labels:
        datetimeFormatter:
          month: M/d
          day: M/d
          hour: HH:mm

